const mySection = {BLOH:"A",IJUH:"A",SEBH:"A",IPEH:"ABCD"};

function isMyClass(row){
  const sec = row[5];
  const course = row[3];
  const mine = mySection[course];
  if(!mine) return false;
  if(mine==="ABCD") return true;
  return sec===mine || sec==="ABCD";
}

const filtered = raw.filter(isMyClass);

const counts = {BLOH:0,IJUH:0,SEBH:0,IPEH:0};
filtered.forEach(r=>counts[r[3]]++);
document.getElementById("c-bloh").textContent=counts.BLOH;
document.getElementById("c-ijuh").textContent=counts.IJUH;
document.getElementById("c-sebh").textContent=counts.SEBH;
document.getElementById("c-ipeh").textContent=counts.IPEH;

const monthOrder = ["Jun","Jul","Aug"];
const monthNames = {Jun:"June 2026",Jul:"July 2026",Aug:"August 2026"};

const byDay = {};
filtered.forEach(r=>{
  const key = r[0]+"|"+r[1];
  if(!byDay[key]) byDay[key]=[];
  byDay[key].push(r);
});

const dayKeys = Object.keys(byDay).sort((a,b)=>{
  const [da]=a.split("|"); const [db]=b.split("|");
  const [dna,mna]=da.split("-"); const [dnb,mnb]=db.split("-");
  const mi = monthOrder.indexOf(mna); const mj = monthOrder.indexOf(mnb);
  if(mi!==mj) return mi-mj;
  return parseInt(dna)-parseInt(dnb);
});

const byMonth = {};
dayKeys.forEach(k=>{
  const [d]=k.split("|"); const mo=d.split("-")[1];
  if(!byMonth[mo]) byMonth[mo]=[];
  byMonth[mo].push(k);
});

const cmap = {BLOH:"bloh",IJUH:"ijuh",SEBH:"sebh",IPEH:"ipeh"};
const shortName = {BLOH:"BLOH",IJUH:"IJUH",SEBH:"SEBH",IPEH:"IPEH"};

const container = document.getElementById("tt");
monthOrder.forEach(mo=>{
  if(!byMonth[mo]) return;
  const mb = document.createElement("div");
  mb.className="month-block";
  mb.innerHTML=`<div class="month-label">${monthNames[mo]}</div>`;
  byMonth[mo].forEach(k=>{
    const [dateStr,dow]=k.split("|");
    const [dn]=dateStr.split("-");
    const sessions = byDay[k];
    const row = document.createElement("div");
    row.className="day-row";
    row.innerHTML=`<div class="day-label"><span class="dow">${dow}</span><br>${dn} ${mo}</div>`;
    const sess = document.createElement("div");
    sess.className="sessions";
    sessions.sort((a,b)=>{
      const ta=a[2], tb=b[2];
      const to12 = t=>{const [h,rest]=t.split(":");const [m,ap]=rest.split(" ");let hr=parseInt(h);if(ap==="PM"&&hr!==12)hr+=12;if(ap==="AM"&&hr===12)hr=0;return hr*60+parseInt(m);};
      return to12(ta)-to12(tb);
    });
    sessions.forEach(s=>{
      const chip = document.createElement("div");
      chip.className=`session ${cmap[s[3]]}`;
      chip.innerHTML=`${shortName[s[3]]}<span class="time">${s[2]}</span>`;
      sess.appendChild(chip);
    });
    row.appendChild(sess);
    mb.appendChild(row);
  });
  container.appendChild(mb);
});

const panel=document.getElementById('today-panel');
const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const now=new Date();
const todayKey=String(now.getDate()).padStart(2,'0')+'-'+Object.keys(months)[now.getMonth()];
const tm=new Date(now); tm.setDate(now.getDate()+1);
const tomorrowKey=String(tm.getDate()).padStart(2,'0')+'-'+Object.keys(months)[tm.getMonth()];

function classesFor(dayKey){
 return filtered.filter(r=>r[0]===dayKey)
 .sort((a,b)=>a[2].localeCompare(b[2]));
}
const todayClasses=classesFor(todayKey);
const tomorrowClasses=classesFor(tomorrowKey);

panel.innerHTML=`
<div class="today-card">
<h3>Today's Classes</h3>
${todayClasses.length?todayClasses.map(c=>`<div class="today-item"><strong>${c[3]}</strong> • ${c[2]}</div>`).join(''):'<div>No classes today</div>'}
</div>
<div class="today-card">
<h3>Tomorrow's Classes</h3>
${tomorrowClasses.length?tomorrowClasses.map(c=>`<div class="today-item"><strong>${c[3]}</strong> • ${c[2]}</div>`).join(''):'<div>No classes tomorrow</div>'}
</div>`;
